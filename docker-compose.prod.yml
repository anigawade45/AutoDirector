services:
  # -------------------------------------------------------------
  # 1. Production API Server
  # -------------------------------------------------------------
  api:
    image: ai-video-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_video_prod_api
    restart: always
    # Security: Restrict direct API port exposure to loopback (127.0.0.1).
    # Public ingress routes strictly through the frontend Nginx reverse proxy on 80/443.
    ports:
      - '127.0.0.1:4000:4000'
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=4000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  # -------------------------------------------------------------
  # 2. Asynchronous Analysis Worker Pool
  # -------------------------------------------------------------
  worker-analysis:
    image: ai-video-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_video_prod_worker_analysis
    restart: always
    command: ['node', 'backend/dist/workers/analysisWorker.js']
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - WORKER_CONCURRENCY=4
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  # -------------------------------------------------------------
  # 3. Asynchronous Video Render & Export Worker Pool
  # -------------------------------------------------------------
  worker-render:
    image: ai-video-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_video_prod_worker_render
    restart: always
    command: ['node', 'backend/dist/workers/renderWorker.js']
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - WORKER_CONCURRENCY=2
      - SCRATCH_DIR=/tmp/renders
    volumes:
      - render_scratch:/tmp/renders
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  # -------------------------------------------------------------
  # 4. Production MongoDB 7 with Single-Node Replica Set (rs0)
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: ai_video_prod_mongodb
    restart: always
    # Security: Restrict port exposure to loopback (127.0.0.1) only, preventing public internet exposure.
    # Production API and worker services communicate directly via the internal Docker bridge network (mongodb:27017).
    ports:
      - '127.0.0.1:27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be provided in production environment}
      - MONGO_REPLICA_HOST=${MONGO_REPLICA_HOST:-mongodb:27017}
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: >
        mongosh -u "$${MONGO_INITDB_ROOT_USERNAME:-admin}" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "
          const targetHost = (typeof process !== 'undefined' && process.env && process.env.MONGO_REPLICA_HOST) || 'mongodb:27017';
          try {
            if (rs.status().ok) {
              const cfg = rs.config();
              if (cfg && cfg.members && cfg.members[0] && cfg.members[0].host !== targetHost && cfg.members[0].host === 'localhost:27017') {
                cfg.members[0].host = targetHost;
                cfg.version = (cfg.version || 1) + 1;
                rs.reconfig(cfg);
              }
            }
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: targetHost }]
            }).ok
          }
        " || mongosh --quiet --eval "
          const targetHost = (typeof process !== 'undefined' && process.env && process.env.MONGO_REPLICA_HOST) || 'mongodb:27017';
          try {
            if (rs.status().ok) {
              const cfg = rs.config();
              if (cfg && cfg.members && cfg.members[0] && cfg.members[0].host !== targetHost && cfg.members[0].host === 'localhost:27017') {
                cfg.members[0].host = targetHost;
                cfg.version = (cfg.version || 1) + 1;
                rs.reconfig(cfg);
              }
            }
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: targetHost }]
            }).ok
          }
        "
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  # -------------------------------------------------------------
  # 5. Production Redis 7 (BullMQ Queues & Pub/Sub SSE)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_video_prod_redis
    restart: always
    # Security: Restrict port exposure to loopback (127.0.0.1) only, preventing public internet exposure.
    # Production API and worker services communicate directly via the internal Docker bridge network (redis:6379).
    ports:
      - '127.0.0.1:6379:6379'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be provided in production environment}
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD must be provided in production environment}',
      ]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'sh', '-c', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  # -------------------------------------------------------------
  # 6. Production Frontend Web App (Nginx Reverse Proxy)
  # -------------------------------------------------------------
  frontend:
    image: ai-video-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_video_prod_frontend
    restart: always
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

volumes:
  mongodb_prod_data:
    name: ai_video_prod_mongodb_data
  redis_prod_data:
    name: ai_video_prod_redis_data
  render_scratch:
    name: ai_video_prod_render_scratch
