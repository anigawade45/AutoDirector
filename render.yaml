services:
  # ----------------------------------------------------------------------------
  # Backend API + In-Process FFmpeg Workers
  # ----------------------------------------------------------------------------
  - type: web
    name: ai-video-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://ai-video-api-eaui.onrender.com/api
      - key: ENABLE_IN_PROCESS_WORKERS
        value: 'true'
      - key: CORS_ORIGIN
        value: https://ai-video-frontend-57bk.onrender.com
      - key: AWS_REGION
        value: ap-southeast-2
      - key: S3_BUCKET_NAME
        value: ai-video-studio-prod-aniket
      - key: S3_ENDPOINT
        value: ''
      - key: S3_FORCE_PATH_STYLE
        value: 'false'
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: WHISPER_MODEL
        value: base
      - key: TEMP_MEDIA_DIR
        value: /tmp/renders
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: FFPROBE_PATH
        value: /usr/bin/ffprobe
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_WORKER_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: 'true'
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Single Page App (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: ai-video-frontend
    runtime: static
    buildCommand: npm run build:shared && npm run build:frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-video-api-eaui.onrender.com/api
