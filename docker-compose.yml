services:
  # -------------------------------------------------------------
  # 1. MongoDB 7 with Single-Node Replica Set (rs0)
  #    Required for multi-document version transactions and snapshots
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: ai_video_mongodb
    restart: unless-stopped
    # Security: Restrict port binding to loopback (127.0.0.1) to prevent LAN / Wi-Fi exposure
    ports:
      - '127.0.0.1:27017:27017'
    # Networking (POT-009): Advertise service hostname 'mongodb:27017' in the replica set
    # so other containers on the Docker bridge network resolve it reliably.
    # Host clients outside Docker connect via directConnection=true (mongodb://127.0.0.1:27017/?directConnection=true)
    # or map '127.0.0.1 mongodb' in their hosts file.
    environment:
      - MONGO_REPLICA_HOST=${MONGO_REPLICA_HOST:-mongodb:27017}
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        mongosh --eval "
          const targetHost = (typeof process !== 'undefined' && process.env && process.env.MONGO_REPLICA_HOST) || 'mongodb:27017';
          try {
            if (rs.status().ok) {
              const cfg = rs.config();
              if (cfg && cfg.members && cfg.members[0] && cfg.members[0].host !== targetHost && cfg.members[0].host === 'localhost:27017') {
                cfg.members[0].host = targetHost;
                cfg.version = (cfg.version || 1) + 1;
                rs.reconfig(cfg);
              }
            }
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: targetHost }]
            }).ok
          }
        " --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # -------------------------------------------------------------
  # 2. Redis 7 (BullMQ worker queues & SSE progress pub/sub)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_video_redis
    restart: unless-stopped
    # Security: Restrict port binding to loopback (127.0.0.1) to prevent LAN / Wi-Fi exposure
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 3. LocalStack S3 (Official, fully public AWS S3 emulator)
  #    Endpoint: http://localhost:4566
  #    Community edition runs S3 for free without requiring a license token
  # -------------------------------------------------------------
  s3:
    image: localstack/localstack:latest
    container_name: ai_video_s3
    restart: unless-stopped
    # Security: Restrict port binding to loopback (127.0.0.1) to prevent LAN / Wi-Fi exposure
    ports:
      - '127.0.0.1:4566:4566'
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - SERVICES=s3
      - DEBUG=0
      # Security: Restrict CORS to local development frontends only (avoiding wildcard * even in emulator)
      - EXTRA_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
      - EXTRA_CORS_ALLOWED_HEADERS=Content-Type,Authorization,Content-MD5,x-amz-*,x-amz-meta-*
      - EXTRA_CORS_EXPOSE_HEADERS=ETag,x-amz-request-id,x-amz-id-2
    volumes:
      - s3_data:/var/lib/localstack

volumes:
  mongodb_data:
    name: ai_video_mongodb_data
  redis_data:
    name: ai_video_redis_data
  s3_data:
    name: ai_video_s3_data
