  </text>

  <!-- Subheading -->
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#FFF5F5" fill-opacity="0.75">
    Conversational cutting room • 5-Pass FFmpeg compiler • Whisper word-sync kinetic subtitles
  </text>

  <!-- Feature Grid Pills -->
  <g transform="translate(80, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="70" rx="12" fill="#222326" stroke="#393B3F"/>
    <text x="20" y="30" font-family="monospace" font-size="11" fill="#E3B5BE" font-weight="bold">ARCHITECTURE</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-size="15" fill="#FFF5F5" font-weight="600">Deterministic 5-Pass</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="70" rx="12" fill="#222326" stroke="#393B3F"/>
    <text x="260" y="30" font-family="monospace" font-size="11" fill="#F7D7D1" font-weight="bold">SUBTITLES</text>
    <text x="260" y="52" font-family="system-ui, sans-serif" font-size="15" fill="#FFF5F5" font-weight="600">Whisper Word-Pop</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="70" rx="12" fill="#222326" stroke="#393B3F"/>
    <text x="500" y="30" font-family="monospace" font-size="11" fill="#E3B5BE" font-weight="bold">COLOR SCIENCE</text>
    <text x="500" y="52" font-family="system-ui, sans-serif" font-size="15" fill="#FFF5F5" font-weight="600">35mm Film LUT Matrix</text>

    <!-- Pill 4 -->
    <rect x="720" y="0" width="220" height="70" rx="12" fill="#222326" stroke="#393B3F"/>
    <text x="740" y="30" font-family="monospace" font-size="11" fill="#F7D7D1" font-weight="bold">TIMELINE SAFETY</text>
    <text x="740" y="52" font-family="system-ui, sans-serif" font-size="15" fill="#FFF5F5" font-weight="600">Branching Version Tree</text>
  </g>

  <!-- URL Branding Bottom -->
  <text x="80" y="555" font-family="monospace" font-size="14" fill="#E3B5BE">
    https://ai-video-frontend-57bk.onrender.com
  </text>
  <text x="1080" y="555" text-anchor="end" font-family="monospace" font-size="14" fill="#FFF5F5" fill-opacity="0.5">
