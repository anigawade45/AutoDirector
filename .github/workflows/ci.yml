name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Check Formatting (Prettier)
        run: npx prettier --check "backend/src/**/*.{ts,js}" "frontend/src/**/*.{ts,tsx}" "shared/src/**/*.ts"

      - name: Build Shared Types & Schemas
        run: npm run build:shared

      - name: Type-Check & Build Backend API
        run: npm run build:backend

      - name: Type-Check & Build Frontend
        run: npm run build:frontend

      - name: Run Backend Tests
        run: npm --workspace=backend run test
        continue-on-error: true

