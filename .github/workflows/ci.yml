name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Check Formatting (Prettier)
        run: npx prettier --check "backend/src/**/*.{ts,js}" "frontend/src/**/*.{ts,tsx}" "shared/src/**/*.ts"

      - name: Build Shared Types & Schemas
        run: npm run build:shared

      - name: Type-Check & Build Backend API
        run: npm run build:backend

      - name: Type-Check & Build Frontend
        run: npm run build:frontend

      - name: Run Backend Tests
        run: npm --workspace=backend run test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_32_characters_minimum
          INTERNAL_WORKER_SECRET: test_worker_secret_for_ci_pipeline_32_chars
          MONGODB_URI: mongodb://127.0.0.1:27017/test_db
          AWS_REGION: ap-southeast-2
          AWS_ACCESS_KEY_ID: test_aws_access_key_id
          AWS_SECRET_ACCESS_KEY: test_aws_secret_access_key
          S3_BUCKET_NAME: test-bucket-name
          CORS_ORIGIN: http://localhost:5173
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          TEMP_MEDIA_DIR: ./tmp/renders

      - name: Run Frontend Tests
        run: npm --workspace=frontend run test
        env:
          NODE_ENV: test
